name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Preparar archivos web
        run: |
          mkdir -p public
          cp index.html app.js database.js respaldo.js service-worker.js manifest.json estilos.css public/
          if [ -f icono.png ]; then cp icono.png public/; fi

      - name: Instalar Capacitor
        run: |
          rm -rf node_modules package.json package-lock.json capacitor.config.json android
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Caja" "com.caja.app" --web-dir=public
          npx cap add android
          npx cap sync

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: caja-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk