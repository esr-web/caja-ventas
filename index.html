
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151515">
  <meta name="description" content="Sistema de caja y control de ventas offline">

  <title>CAJA | Gestión de ventas</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icono.png">
  <link rel="apple-touch-icon" href="./icono.png">
  <link rel="stylesheet" href="./estilos.css">
</head>

<body>

  <header class="encabezado">
    <div class="marca">
      <h1>CAJA</h1>
      <p>Gestión de ventas</p>
    </div>
  </header>

  <main id="contenido">

    <!-- INICIO -->
    <section id="pantallaInicio" class="pantalla activa">

      <div class="bienvenida">
        <h2>Panel principal</h2>
        <p>Selecciona una opción para continuar.</p>
      </div>

      <div class="menu-principal">

        <button class="tarjeta-menu" onclick="navegar('caja')">
          <div class="icono-menu">🛒</div>
          <div class="texto-menu">
            <h3>Nueva venta</h3>
            <p>Registrar una venta.</p>
          </div>
          <span class="flecha-menu">↗</span>
        </button>

        <button class="tarjeta-menu" onclick="navegar('productos')">
          <div class="icono-menu">📦</div>
          <div class="texto-menu">
            <h3>Productos</h3>
            <p>Administrar los productos.</p>
          </div>
          <span class="flecha-menu">↗</span>
        </button>

        <button class="tarjeta-menu" onclick="navegar('registro')">
          <div class="icono-menu">📋</div>
          <div class="texto-menu">
            <h3>Registro de ventas</h3>
            <p>Consultar, filtrar y eliminar ventas.</p>
          </div>
          <span class="flecha-menu">↗</span>
        </button>

        <button class="tarjeta-menu" onclick="navegar('estadisticas')">
          <div class="icono-menu">📊</div>
          <div class="texto-menu">
            <h3>Estadísticas</h3>
            <p>Consultar gráficos y resultados de las ventas.</p>
          </div>
          <span class="flecha-menu">↗</span>
        </button>

        <button class="tarjeta-menu" onclick="navegar('efectivo')">
          <div class="icono-menu">💵</div>
          <div class="texto-menu">
            <h3>Conteo de efectivo</h3>
            <p>Calcular el dinero disponible en caja.</p>
          </div>
          <span class="flecha-menu">↗</span>
        </button>

      </div>

    </section>

    <!-- CAJA -->
    <section id="pantallaCaja" class="pantalla"></section>

    <!-- PRODUCTOS -->
    <section id="pantallaProductos" class="pantalla"></section>

    <!-- REGISTRO -->
    <section id="pantallaRegistro" class="pantalla"></section>

    <!-- ESTADÍSTICAS -->
    <section id="pantallaEstadisticas" class="pantalla"></section>

    <!-- EFECTIVO -->
    <section id="pantallaEfectivo" class="pantalla"></section>

  </main>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="navegacion-inferior">

    <button onclick="navegar('inicio')" class="nav-item">
      <span>⌂</span>
      <small>Inicio</small>
    </button>

    <button onclick="navegar('caja')" class="nav-item">
      <span>＋</span>
      <small>Caja</small>
    </button>

    <button onclick="navegar('productos')" class="nav-item">
      <span>▣</span>
      <small>Productos</small>
    </button>

    <button onclick="navegar('registro')" class="nav-item">
      <span>☷</span>
      <small>Registro</small>
    </button>

    <button onclick="navegar('efectivo')" class="nav-item">
      <span>＄</span>
      <small>Efectivo</small>
    </button>

  </nav>

  <script src="./database.js"></script>
  <script src="./app.js"></script>
  <script src="./respaldo.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }
  </script>

</body>
</html>
