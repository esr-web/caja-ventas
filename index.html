
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151515">
  <meta name="description" content="Sistema personal de caja y registro de ventas offline">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Caja de Ventas</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icono.png" type="image/png">
  <link rel="apple-touch-icon" href="./icono.png">
  <link rel="stylesheet" href="./estilos.css">
</head>

<body>

  <div id="app">
    <header class="encabezado">
      <h1>CAJA</h1>
      <span id="estadoConexion">● Preparando aplicación</span>
    </header>

    <main>
      <section id="pantallaCaja">
        <h2>Nueva venta</h2>
        <div id="productosVenta"></div>
        <div id="resumenVenta"></div>
      </section>
    </main>
  </div>

  <script src="./database.js"></script>
  <script src="./app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./service-worker.js")
          .then(function() {
            console.log("Aplicación preparada para funcionar offline.");
          })
          .catch(function(error) {
            console.error("Error al registrar el Service Worker:", error);
          });
      });
    }
  </script>

</body>
</html>
